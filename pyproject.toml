[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-async-llm-client"
version = "0.1.0"
description = "Cliente de LLM unificado, asíncrono (OpenAI + Anthropic)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
